name: schema-lens-ci

on:
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: |
          schema-lens run examples/changesets/fieldtype-change.yaml --out out/ci_run || true
      - run: |
          if [ -f out/ci_run/report.json ]; then
            cat out/ci_run/report.json
          fi
