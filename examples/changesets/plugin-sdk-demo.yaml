solrguard_version: 1

baseline:
  solr_url: "http://localhost:8983/solr"
  collection: "products"
  request_defaults:
    rows: 10
    fl: "id,score"
    defType: "edismax"

shadow:
  mode: "solrcloud"
  solr_url: "http://localhost:8983/solr"
  collection_name_template: "{collection}__shadow__{ts}"
  num_shards: 1
  replication_factor: 1
  cleanup: true
  allow_shared_configset_fallback: true

data:
  docs_source:
    type: "file"
    path: "examples/docs.jsonl"
    format: "jsonl"
    id_field: "id"
  sample_n: 500

queries:
  source:
    type: "plugin"
    provider: "sample_query_source"
  max_queries: 200

changes:
  - op: "queryparams.set"
    set:
      qf: "title^5 text"
      pf: "title^20"

plugins:
  enabled: true
  directories:
    - "../plugins"
  load_builtin: true
  enabled_plugins:
    - "sample_query_source"
    - "sample_gate"
    - "sample_report"
  strict_mode: false
  config:
    sample_query_source:
      path: "examples/querylogs/procurement_queries_custom.json"
    sample_gate:
      overlap_threshold: 0.5
      failure_pct: 30
    sample_report:
      group_by: "tenant"
