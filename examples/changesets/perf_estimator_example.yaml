solrguard_version: 1

baseline:
  solr_url: "http://localhost:8983/solr"
  collection: "products"
  request_defaults:
    rows: 10
    fl: "id,score"
    defType: "edismax"
    extra_params:
      qf: "title^3 text"
      pf: "title^10"

shadow:
  mode: "solrcloud"
  solr_url: "http://localhost:8983/solr"
  collection_name_template: "{collection}__shadow__{ts}"
  num_shards: 1
  replication_factor: 1
  cleanup: true

data:
  docs_source:
    type: "file"
    path: "examples/docs.jsonl"
    format: "jsonl"
    id_field: "id"

queries:
  source:
    type: "file"
    path: "examples/queries/procurement_perf_queries.jsonl"
    format: "jsonl"
  max_queries: 25

changes:
  - op: "queryparams.set"
    set:
      qf: "title^5 text"
      pf: "title^20"

performance:
  enabled: true
  warmup:
    enabled: true
    iterations: 1
    strategy: "interleaved"
  capture:
    qtime: true
    client_latency: true
    percentiles: [50, 95, 99]
    per_query: true
  caches:
    enabled: true
    scope: "both"
    names: ["filterCache", "queryResultCache", "documentCache", "fieldValueCache"]
  index:
    enabled: true
    luke: true
    segment_info: true
    store_docvalues_heuristics: true

evaluation:
  k: 10
  metrics: [overlap, jaccard, kendall_tau]
