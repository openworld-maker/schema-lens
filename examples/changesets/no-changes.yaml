solrguard_version: 1

baseline:
  solr_url: "http://localhost:8983/solr"
  collection: "products"

shadow:
  mode: "solrcloud"
  solr_url: "http://localhost:8983/solr"
  collection_name_template: "{collection}__shadow__{ts}"
  num_shards: 1
  replication_factor: 1
  cleanup: true
  allow_shared_configset_fallback: true

data:
  docs_source:
    type: "file"
    path: "examples/docs.jsonl"
    format: "jsonl"
    id_field: "id"

queries:
  source:
    type: "file"
    path: "examples/queries.txt"
    format: "simple"
  max_queries: 50

changes: []

evaluation:
  k: 10
  metrics: [overlap, jaccard, kendall_tau]
  explain:
    enabled: false
