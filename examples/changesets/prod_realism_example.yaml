solrguard_version: 1

baseline:
  solr_url: "http://localhost:8983/solr"
  collection: "products"
  request_defaults:
    rows: 10
    fl: "id,score"
    defType: "edismax"
    extra_params:
      fq: []
      qf: "title^3 text"
      pf: "title^10"

shadow:
  mode: "solrcloud"
  solr_url: "http://localhost:8983/solr"
  collection_name_template: "{collection}__shadow__{ts}"
  num_shards: 1
  replication_factor: 1
  cleanup: true
  allow_shared_configset_fallback: true

preflight:
  fail_on_risk: false

data:
  docs_source:
    type: "solr"
    solr_url: "http://localhost:8983/solr"
    collection: "products"
    mode: "cursormark"
    query: "*:*"
    sort: "id asc"
    fl: "id,title,text,category,price"
    sample_n: 200
    batch_size: 50
    out_sample_path: "out/docs_sample.jsonl"

queries:
  source:
    type: "log"
    path: "examples/logs/solr_requests.log"
    format: "solr_params"
  max_queries: 100
  sampling:
    mode: "reservoir"
    seed: 42
  sanitize:
    enabled: true
    rules:
      - type: "mask_email"
      - type: "mask_uuid"
      - type: "drop_param"
        name: "auth"
      - type: "drop_param"
        name: "token"

replay:
  capture:
    facets:
      enabled: true
      fields: ["category"]
      limit: 20
    track_numfound: true
    track_sort: true

changes:
  - op: "schema.field.update"
    field: "title"
    set:
      stored: true
  - op: "queryparams.set"
    set:
      qf: "title^5 text"
      pf: "title^20"

evaluation:
  k: 10
  metrics:
    - overlap
    - jaccard
    - kendall_tau
  explain:
    enabled: true
    structured: true
    max_queries: 5
    max_docs_per_query: 2
