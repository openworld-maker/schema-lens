solrguard_version: 1

security:
  profile: enterprise-safe
  baseline_auth:
    type: mtls
    cert_file: "${SOLR_CLIENT_CERT}"
    key_file: "${SOLR_CLIENT_KEY}"
    ca_file: "${SOLR_CA_CERT}"
  shadow_auth:
    type: mtls
    cert_file: "${SOLR_CLIENT_CERT}"
    key_file: "${SOLR_CLIENT_KEY}"
    ca_file: "${SOLR_CA_CERT}"

audit:
  enabled: true
  requested_by: "platform-team@example.com"
  team: "search-platform"
  ticket_id: "CR-32301"
  environment_label: "prod"
