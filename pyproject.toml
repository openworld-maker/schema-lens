[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-lens"
version = "0.1.2"
description = "Schema Evolution & Impact Simulator for Solr"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Schema Lens Contributors" }
]
dependencies = [
  "typer>=0.12.3",
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
  "Jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[project.scripts]
schema-lens = "schema_lens.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["schema_lens*"]

[tool.setuptools.package-data]
schema_lens = ["report/templates/*.j2"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: marks tests that require external services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
